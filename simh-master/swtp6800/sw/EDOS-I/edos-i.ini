set console -n -q log=console.txt 
set debug -n -q debug.txt

; Motorola Exorciser with ExorDisk-I Emulation

set cpu hex
set cpu noitrap
set cpu nomtrap
set cpu nodebug

set mp-b2 64k
set mp-b2 iobase=fcf0

load exbug11.bin f000
load Build/PROM.S19

set mp-b2 rombase=e800

dep fffe f0
dep ffff 00
reset 

set icom enabled
set icom iobase=ec00

att icom0 EDOS-I_System.dsk
att icom1 -q -n Work/Blank.dsk

; start symbolic trace
; set cpu  debug=symb;inst
; set icom debug=all
; set mp-s debug=all

go until "EXBUG"
send "MAID"
go until "*"
send "E800;G"
go until "!"

send "I1"
send "\r"
go until "!"

send "L"
send "\r"
go until "!"

go

:end
